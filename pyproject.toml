[project]
name = "enterprise-backend-automation-engine"
version = "0.1.0"
description = "Production-ready FastAPI backend and automation engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.29.0", "alembic>=1.13.0", "pydantic-settings>=2.4.0",
  "pyjwt[crypto]>=2.9.0", "pwdlib[argon2]>=0.2.0", "redis>=5.0.0",
  "celery[redis]>=5.4.0", "httpx>=0.27.0", "pandas>=2.2.0", "reportlab>=4.2.0",
  "python-multipart>=0.0.9", "pypdf>=5.0.0", "python-docx>=1.1.0",
  "google-genai>=1.0.0", "structlog>=24.4.0", "email-validator>=2.2.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "aiosqlite>=0.20.0", "ruff>=0.6.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
